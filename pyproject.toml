[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptdns"
version = "0.1.0"
description = "AdaptDNS: hybrid two-stage DNS-tunneling detection over encrypted DoH/DoT flows"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "xgboost>=2.0",
    "certifi>=2024.0",
]

[project.optional-dependencies]
pcap = ["scapy>=2.5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["adaptdns*"]
